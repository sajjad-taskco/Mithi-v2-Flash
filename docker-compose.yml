services:
  mithi:
    build: .
    image: mithi-v2-flash:latest
    container_name: mithi-v2-flash
    ports:
      - "127.0.0.1:${MITHI_PORT:-8010}:8000"
    environment:
      MITHI_THREADS: "4"
    volumes:
      - ./out:/out
      - mithi-data:/data   # the API key (generated on first start: docker logs mithi-v2-flash)
    restart: unless-stopped
    networks:
      default:
      taskco:
        aliases: [mithi]   # the ecommerce app reaches it as http://mithi:8000

networks:
  taskco:
    external: true
    name: taskco-dev_taskco-dev-net

volumes:
  mithi-data:
